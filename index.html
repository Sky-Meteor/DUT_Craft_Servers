<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DUT_Craft · 服务器机房</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <!-- 防 FOUC：在样式应用前根据存储/系统偏好锁定主题（与 theme.ts 共用 key "dutcraft-theme"） -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("dutcraft-theme");
          var prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
          var theme = stored === "light" || stored === "dark" ? stored : prefersLight ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <!-- 噪点颗粒覆层：给两种主题都加上一层材质 -->
    <div class="grain" aria-hidden="true"></div>

    <main class="room">
      <!-- 配置告警胶带：servers.json 加载失败或含无效条目时由 main.ts 填充 -->
      <div id="config-banner" class="alarm-tape" hidden></div>

      <header class="console">
        <div class="console-top">
          <div class="nameplate">
            <h1>DUT_CRAFT</h1>
            <p class="plate-sub"><span class="sub-cn">服务器状态机房</span><span class="sub-en">REDSTONE&nbsp;SERVER&nbsp;ROOM</span></p>
          </div>
          <div class="console-side">
            <div class="clock" role="timer" aria-label="值班时钟">
              <span id="clock-time" class="clock-time">--:--:--</span>
            </div>
            <button id="theme-toggle" class="shift-toggle" type="button" aria-label="切换明暗主题（交接班）" title="切换明暗主题（交接班）">
              <span class="shift-led" aria-hidden="true"></span>
              <span id="shift-name" class="shift-name">夜班</span>
            </button>
          </div>
        </div>

        <div class="console-stats">
          <div class="stat">
            <span class="stat-value" id="stat-units">--</span>
            <span class="stat-label">设备 UNITS</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="stat-online">--</span>
            <span class="stat-label">在线 ONLINE</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="stat-players">--</span>
            <span class="stat-label">玩家 PLAYERS</span>
          </div>
          <div class="sync-block">
            <button id="refresh-all" class="sync-all" type="button" aria-label="刷新所有服务器状态">
              <span class="sync-glyph" aria-hidden="true">⟳</span>同步全部
            </button>
            <span id="last-sync" class="last-sync">上次同步 --:--:--</span>
          </div>
        </div>
      </header>

      <section class="rack" id="status-board" aria-live="polite"></section>

      <footer class="room-footer">
        <span class="footer-pair"><span class="footer-key">DATA</span>api.mcsrvstat.us</span>
        <span class="footer-pair"><span class="footer-key">CACHE</span>接口约缓存 5 分钟，数据未必实时</span>
        <span class="footer-pair"><span class="footer-key">SHIFT</span>夜班 · 白班 轮值中</span>
      </footer>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
