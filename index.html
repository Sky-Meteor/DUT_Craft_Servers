<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DUT Craft · 服务器状态</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <!-- 防 FOUC：在样式应用前根据存储/系统偏好锁定主题（与 theme.ts 共用 key "dutcraft-theme"） -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("dutcraft-theme");
          var prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
          var theme = stored === "light" || stored === "dark" ? stored : prefersLight ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <!-- 极淡噪点，给两面主题都加一层纸感 -->
    <div class="grain" aria-hidden="true"></div>

    <main class="page">
      <!-- 配置提示：servers.json 加载失败或含无效条目时由 main.ts 填充 -->
      <div id="config-banner" class="notice" hidden></div>

      <header class="masthead">
        <div class="masthead-main">
          <p class="overline">服务器状态 · LIVE STATUS</p>
          <h1>DUT <em>Craft</em></h1>
        </div>
        <div class="masthead-side">
          <span id="clock-time" class="clock" role="timer" aria-label="当前时间">--:--:--</span>
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换深浅主题" title="切换深浅主题">
            <span class="theme-glyph" aria-hidden="true">◐</span>
            <span id="shift-name" class="theme-name">深色</span>
          </button>
        </div>
      </header>

      <section class="summary">
        <div class="summary-stats">
          <span class="sum"><b id="stat-units">--</b><i>服务器</i></span>
          <span class="sum"><b id="stat-online">--</b><i>在线</i></span>
          <span class="sum"><b id="stat-players">--</b><i>玩家</i></span>
        </div>
        <div class="summary-actions">
          <span id="last-sync" class="last-sync">上次同步 --:--:--</span>
          <button id="refresh-all" class="sync" type="button" aria-label="刷新所有服务器状态">↻ 同步</button>
        </div>
      </section>

      <section class="board" id="status-board" aria-live="polite"></section>

      <footer class="page-foot">
        <span>数据来自 api.mcsrvstat.us · 约有数分钟缓存</span>
      </footer>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
