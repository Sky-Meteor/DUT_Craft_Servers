<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DUT_Craft 服务器状态查询</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Noto+Serif+SC:wght@500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <!-- 防 FOUC：在样式应用前根据存储/系统偏好锁定主题 -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("dutcraft-theme");
          var prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
          var theme = stored === "light" || stored === "dark" ? stored : prefersLight ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <!-- 背景动画舞台：dark 与 light 两套对照层，由 CSS 按主题显隐 -->
    <div class="bg-stage" aria-hidden="true">
      <!-- 月夜星咏（dark）-->
      <div class="stars"></div>
      <div class="stars-mid"></div>
      <div class="stars-far"></div>
      <div class="moon"></div>
      <!-- 流星由 theme.ts 按随机数量/间隔动态生成 -->
      <!-- 晴空日照（light）-->
      <div class="sun"></div>
    </div>

    <main class="layout">
      <!-- 配置问题提示：servers.json 加载失败或含无效条目时由 main.ts 填充 -->
      <div id="config-banner" class="config-banner" hidden></div>
      <header class="hero">
        <div class="hero-top">
          <h1>DUT Craft 服务器列表</h1>
          <div class="theme-switch">
            <span class="theme-name" id="theme-name" aria-hidden="true"></span>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换明暗主题" title="切换明暗主题">
              <span class="icon-moon" aria-hidden="true">🌙</span>
              <span class="icon-sun" aria-hidden="true">☀️</span>
            </button>
          </div>
        </div>
        <button id="refresh-all" class="refresh-button" type="button" aria-label="刷新所有服务器状态">
          刷新全部服务器
        </button>
      </header>

      <section>
        <div id="status-board" class="server-grid" aria-live="polite"></div>
      </section>

      <footer class="site-footer">
        <div>
          <span>API：</span>
          <a class="api-link" href="https://api.mcsrvstat.us/2" target="_blank" rel="noreferrer noopener">
            https://api.mcsrvstat.us/2
          </a>
        </div>
        <div>查询状态会缓存 2 分钟，可能不是最新数据</div>
      </footer>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
